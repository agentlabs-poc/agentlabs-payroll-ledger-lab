<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="1120" viewBox="0 0 1480 1120" role="img" aria-labelledby="title desc">
<title id="title">Payroll canonical storage map</title><desc id="desc">Three canonical ledger tables plus one L1 record store and one L2 store. All nine L1 record types, one L2 type, and five ledger entry kinds are shown.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L8 4.5 L0 9 Z" fill="#7C8EA4"/></marker></defs>
<rect width="1480" height="1120" fill="#F7FAFD"/>
<g font-family="Noto Sans, Arial, sans-serif" fill="#172B46">
<text x="48" y="62" font-size="34" font-weight="700" fill="#172B46">Payroll canonical storage</text>
<text x="48" y="99" font-size="18" font-weight="400" fill="#52647A">Three ledgers. One L1 record store. One separate L2 record store.</text>
<rect x="48" y="135" width="217" height="30" rx="15" fill="#EAF0FF" stroke="#EAF0FF"/>
<text x="60" y="155" font-size="12" font-weight="700" fill="#2563EB">15 REQUIRED ROW KINDS</text>
