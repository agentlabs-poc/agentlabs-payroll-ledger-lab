<title id="title">E101 payroll journey: sources to draft, commit and employer liability</title><desc id="desc">November 2026 example: 30,000 Basic plus 20,000 HRA and 3,000 employer contribution, 2,000 loan deduction; gross 53,000, deductions 5,000 and net 48,000. A 3,000 liability has 2,000 allocated with proof, leaving 1,000 outstanding.</desc>
